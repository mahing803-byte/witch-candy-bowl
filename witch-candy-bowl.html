<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마녀의 사탕 그릇</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap">
<style>
/* Layout: 세로 한 화면 — HUD / 픽셀 무대 / 방 이동 / 가방 / 대사창. 귀여운 밤 파스텔 */
:root{
  --night:#1a1233; --panel:#2a1f4a; --edge:#6b56a8; --deep:#140e28; --pumpkin:#ff9a3c;
  --candle:#ffe27a; --ghost:#c8fff0; --pink:#ff8fb1; --text:#fff4e6; --mute:#b9a8e0;
  --pix:"Press Start 2P",ui-monospace,monospace; --ko:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{word-break:keep-all;overflow-wrap:break-word;background:var(--night);color:var(--text);font-family:var(--ko);font-size:17px;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box}
.px{background:var(--panel);border:3px solid var(--edge);box-shadow:inset -3px -3px 0 var(--deep),inset 3px 3px 0 #3a2c66}
.hud{display:flex;align-items:center;gap:8px;padding:6px 8px}
.hud h1{margin:0;font-size:17px;font-weight:400;color:var(--pumpkin);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer{font-family:var(--pix);font-size:14px;color:var(--candle);font-variant-numeric:tabular-nums}
#timer.low{color:var(--pink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
button{font:inherit;color:var(--text);background:#3a2c66;border:3px solid var(--edge);padding:6px 10px;cursor:pointer;box-shadow:inset -2px -2px 0 var(--deep);border-radius:0;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:none}
button:focus-visible{outline:3px solid var(--candle);outline-offset:1px}
button:disabled{opacity:.4;cursor:default}
#hintBtn{font-size:15px;padding:6px 10px;background:#4a3a14;border-color:#c8a040;color:var(--candle);flex:0 0 auto}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:3px solid var(--edge);max-width:100%}
#chap{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-family:var(--pix);font-size:10px;color:var(--candle);background:rgba(20,14,40,.88);border:2px solid var(--edge);padding:6px 8px;white-space:nowrap;pointer-events:none}
.nav{display:flex;gap:6px}
.nav button{flex:1;font-size:16px;padding:5px 4px}
.nav button[aria-current="true"]{background:var(--pumpkin);color:#3a1a06;border-color:#ffc480}
#inv{display:flex;gap:6px;padding:5px;min-height:50px;align-items:center;overflow-x:auto}
.slot{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 5px;font-size:12px;background:var(--deep);border:2px solid var(--edge)}
.slot canvas{border:0;width:26px;height:26px}
#box{min-height:88px;padding:8px 12px;line-height:1.45;cursor:pointer;position:relative;display:flex;gap:10px;align-items:flex-start}
#face{width:44px;height:44px;flex:0 0 auto;border:2px solid var(--edge);background:var(--deep)}
.txt{flex:1;min-width:0}
#who{color:var(--pumpkin);font-size:15px;margin-bottom:2px}
#who.g{color:var(--ghost)}
#more{position:absolute;right:10px;bottom:6px;color:var(--candle);font-family:var(--pix);font-size:10px;animation:blink 1s steps(2) infinite}
.ov{position:fixed;inset:0;background:rgba(14,9,30,.9);display:flex;align-items:center;justify-content:center;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.card{width:100%;max-width:360px;max-height:100%;overflow:auto;box-sizing:border-box;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:center}
.card h2{margin:0;font-weight:400;font-size:28px;color:var(--pumpkin);text-wrap:balance;text-shadow:3px 3px 0 #3a1a06}
.card p{margin:0;line-height:1.6;text-wrap:pretty}
#art{width:100%;height:auto;aspect-ratio:160/110;max-width:100%;box-sizing:border-box}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chips span{font-size:14px;padding:4px 8px;background:var(--deep);border:2px solid var(--edge);color:var(--mute)}
.chips b{color:var(--candle);font-weight:400}
.diary{text-align:left;background:#fff1d6;color:#4a2c1a;padding:12px;line-height:1.6;border:3px solid #c89a6a}
.diary p+p{margin-top:6px}
.eyebrow{font-family:var(--pix);font-size:10px;color:var(--mute);letter-spacing:.1em}
.big{font-size:21px;padding:10px;background:var(--pumpkin);color:#3a1a06;border-color:#ffc480}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dial{display:flex;flex-direction:column;gap:4px;align-items:center}
.dial span{font-family:var(--pix);font-size:20px;color:var(--candle);background:var(--deep);border:3px solid var(--edge);min-width:44px;padding:8px 4px;box-sizing:border-box}
.dial span.sym{font-family:var(--ko);font-size:17px;min-width:58px}
.slots{display:flex;gap:6px;justify-content:center}
.slots div{width:84px;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--deep);border:2px dashed var(--edge)}
.lesson{background:#fff1d6;color:#4a2c1a;border:3px solid var(--candle);box-shadow:4px 4px 0 #3a1a06;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.lesson .eyebrow{color:#a0703a}
.lesson strong{font-weight:400;font-size:21px;color:#c8501a;text-wrap:balance}
.lesson p{font-size:15px}
.mute{color:var(--mute);font-size:14px}
.px{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
#snd{padding:6px 9px;font-size:15px;flex:0 0 auto}
#snd.off{opacity:.45;text-decoration:line-through}
#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 12px;background:#fff1d6;color:#4a2c1a;border:3px solid var(--candle);box-shadow:3px 3px 0 #3a1a06;font-size:16px;white-space:nowrap;pointer-events:none;animation:pop .3s steps(3)}
#toast canvas{width:28px;height:28px;border:0}
@keyframes pop{0%{transform:translateX(-50%) translateY(10px) scale(.6)}100%{transform:translateX(-50%) scale(1)}}
.shake{animation:shake .32s steps(4)}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
.card{animation:rise .25s steps(3)}
@keyframes rise{0%{transform:translateY(12px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

[hidden]{display:none!important}
html,body{margin:0}
</style>
</head>
<body>

<div id="app">
  <header class="hud px">
    <h1>마녀의 사탕 그릇</h1>
    <span id="timer">08:00</span>
    <button id="snd" type="button" aria-pressed="true" aria-label="소리 켜기/끄기">♪</button>
    <button id="hintBtn" type="button">힌트 −10초</button>
  </header>
  <div id="stage"><canvas id="cv" width="160" height="200" aria-label="마녀의 집"></canvas><div id="chap" hidden></div><div id="toast" hidden></div></div>
  <div class="nav" id="nav">
    <button type="button" data-room="kitchen">부엌</button>
    <button type="button" data-room="hall" aria-current="true">거실</button>
    <button type="button" data-room="attic">다락방</button>
  </div>
  <div id="inv" class="px" aria-label="가방"></div>
  <div id="box" class="px" role="status"><canvas id="face" width="12" height="12" hidden></canvas><div class="txt"><div id="who"></div><div id="line"></div></div><div id="more" hidden>▼</div></div>
</div>

<div id="ov" class="ov"><div id="card" class="card px"></div></div>

<script>
const cv=document.getElementById('cv');let c=cv.getContext('2d');
const $=id=>document.getElementById(id);
const R=(x,y,w,h,col,ctx=c)=>{ctx.fillStyle=col;ctx.fillRect(x|0,y|0,w,h)};
const O=(cx,cy,r,col)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r)R(cx+dx,cy+dy,1,1,col)};
const on=(ctx,fn)=>{const p=c;c=ctx;fn();c=p};
const A=(a,fn)=>{c.globalAlpha=a;fn();c.globalAlpha=1};
const TIME=480;
const dith=(x,y,w,h,col)=>{for(let j=0;j<h;j++)for(let i=j%2;i<w;i+=2)R(x+i,y+j,1,1,col)};
let AC=null,muted=false;
function sfx(k){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return}
  const P={blip:[[900,.025,'square',.02]],tap:[[520,.05,'square',.04]],item:[[660,.07],[880,.07],[1320,.14]],open:[[392,.07],[523,.07],[659,.07],[784,.16]],
    wrong:[[200,.1,'sawtooth',.05],[150,.18,'sawtooth',.05]],magic:[[523,.08],[659,.08],[784,.08],[1047,.08],[1319,.24]],door:[[262,.1],[330,.1],[392,.1],[523,.3]],sad:[[392,.22,'triangle',.08],[330,.22,'triangle',.08],[262,.45,'triangle',.08]]}[k];
  let t=AC.currentTime;P.forEach(([f,d,type='square',v=.05])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.9})}
function toast(id){const el=document.getElementById('toast');el.innerHTML='';const ic=document.createElement('canvas');ic.width=ic.height=12;ICON[id](ic.getContext('2d'));el.append(ic,ITEMS[id].n+' 획득!');el.hidden=true;void el.offsetWidth;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1500)}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
let typeT=null;const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function typeLine(t){clearInterval(typeT);S.full=t;const el=document.getElementById('line');if(RM){el.textContent=t;S.typing=false;return}
  let i=0;S.typing=true;el.textContent='';typeT=setInterval(()=>{i++;el.textContent=t.slice(0,i);if(i%3===1)sfx('blip');if(i>=t.length){clearInterval(typeT);S.typing=false}},24)}
function skipType(){clearInterval(typeT);document.getElementById('line').textContent=S.full||'';S.typing=false}
function face(w){const x=document.getElementById('face').getContext('2d');x.clearRect(0,0,12,12);R(0,0,12,12,'#140e28',x);
  const id=Object.keys(ITEMS).find(k=>ITEMS[k].n===w);if(id)return ICON[id](x);
  if(/루카|유령|속삭임/.test(w)){x.globalAlpha=w.includes('속삭임')?.45:1;const g='#c8fff0';R(3,1,6,1,g,x);R(2,2,8,8,g,x);R(1,4,10,6,g,x);R(1,10,2,1,g,x);R(5,10,2,1,g,x);R(9,10,2,1,g,x);R(4,5,1,2,'#1a2a3a',x);R(7,5,1,2,'#1a2a3a',x);R(3,7,1,1,'#ff8fb1',x);R(8,7,1,1,'#ff8fb1',x);x.globalAlpha=1;return}
  if(w.includes('마녀')){R(5,0,2,1,'#5a3a8a',x);R(4,1,4,2,'#5a3a8a',x);R(1,3,10,1,'#4a2a7a',x);R(3,4,6,6,'#ffdcc0',x);R(2,4,1,5,'#e0e0f0',x);R(9,4,1,5,'#e0e0f0',x);R(3,6,2,1,'#3a1a28',x);R(7,6,2,1,'#3a1a28',x);R(5,7,2,1,'#e8a090',x);R(4,9,4,1,'#c8506a',x);R(3,10,6,2,'#5a3a8a',x);return}
  if(w.includes('고양이')){R(2,2,2,2,'#2a2238',x);R(8,2,2,2,'#2a2238',x);R(2,4,8,6,'#2a2238',x);R(3,6,2,2,'#ffe27a',x);R(7,6,2,2,'#ffe27a',x);R(5,8,2,1,'#ff8fb1',x);return}
  R(5,0,2,1,'#8a5ad8',x);R(4,1,4,2,'#8a5ad8',x);R(1,3,10,1,'#7a4ac8',x);R(3,4,6,6,'#ffdcc0',x);R(3,4,6,1,'#7a4a2a',x);R(2,4,1,4,'#7a4a2a',x);R(9,4,1,4,'#7a4a2a',x);R(4,6,1,2,'#3a1a28',x);R(7,6,1,2,'#3a1a28',x);R(3,8,1,1,'#ff8fb1',x);R(8,8,1,1,'#ff8fb1',x);R(5,9,2,1,'#c8506a',x);R(3,10,6,2,'#4a3a8a',x)}
function vignette(){for(let i=0;i<5;i++)A(.07,()=>{const d=2+i*3;R(0,0,160,d,'#0a0618');R(0,200-d,160,d,'#0a0618');R(0,d,d,200-2*d,'#0a0618');R(160-d,d,d,200-2*d,'#0a0618')})}

/* ---------- 아이템 ---------- */
const DIARY={
  diary1:['1926년 10월 31일','마녀 할머니네 그릇엔 사탕이 산더미였다. 팻말엔 "1인당 1개만!"','괘종시계가 열두 번 울리는 <b>마녀의 시간</b> 전에, 나는 봉지를 활짝 열고 그릇을 통째로 쏟아 넣었다.','— 루카'],
  diary2:['같은 날, 밤','문밖에서 다른 아이들이 빈 그릇 앞에서 울었다. 나는 모른 척 다락방에 숨어 혼자 먹었다.','이상하다. 사탕이 생각보다 하나도 달지 않았다.'],
  diary3:['마지막 장','할머니가 문 너머로 말했다. "루카, 네가 나누는 날 문이 열린단다."','나는 끝까지 봉지를 놓지 않았다. 그리고… 해가 떴다.']
};
const ITEMS={
  candy:{n:'사탕 봉지',d:'그릇에서 몽땅 가져온 사탕. 묵직하다.'},
  wing:{n:'박쥐 날개',d:'얇고 바스락거린다.'},
  web:{n:'거미줄',d:'끈적한 은빛 거미줄.'},
  dew:{n:'달빛 이슬',d:'병 속에서 달처럼 빛나는 물방울.'},
  key:{n:'다락방 열쇠',d:'손잡이에 작은 별이 새겨진 열쇠. 위쪽 어딘가에 쓰일 것 같다.'},
  match:{n:'성냥',d:'한 개비 남은 성냥.'},
  recipe:{n:'레시피',d:'「투명 해제 물약」 ① 달빛 이슬 → ② 거미줄 → ③ 박쥐 날개. 부엌 가마솥에 넣을 것.'},
  diary1:{n:'일기 1'},diary2:{n:'일기 2'},diary3:{n:'일기 3'}
};
const book=col=>x=>{R(2,1,8,10,col,x);R(2,1,2,10,'#4a2c1a',x);R(5,4,4,1,'#fff1d6',x);R(5,6,3,1,'#fff1d6',x);R(8,9,1,1,'#ff8fb1',x)};
const ICON={
  candy:x=>{R(4,2,4,2,'#ff6a8a',x);R(2,4,8,6,'#ff8fb1',x);R(3,5,2,2,'#ffe27a',x);R(7,7,2,2,'#8ad8ff',x);R(5,1,2,1,'#fff4e6',x)},
  wing:x=>{R(1,5,10,2,'#6a5a8a',x);R(3,3,6,2,'#6a5a8a',x);R(2,7,2,2,'#6a5a8a',x);R(6,7,2,2,'#6a5a8a',x);R(5,4,1,1,'#fff',x)},
  web:x=>{for(let i=0;i<12;i++){R(i,i,1,1,'#dfe8f8',x);R(11-i,i,1,1,'#dfe8f8',x);R(6,i,1,1,'#dfe8f8',x);R(i,6,1,1,'#dfe8f8',x)}},
  dew:x=>{R(5,1,2,2,'#a07a50',x);R(3,3,6,8,'#5a6aaa',x);R(4,5,4,5,'#d8f0ff',x);R(5,6,1,2,'#fff',x)},
  key:x=>{R(1,3,5,5,'#ffd25a',x);R(2,4,3,3,'#2a1f4a',x);R(6,5,5,1,'#ffd25a',x);R(9,6,1,2,'#ffd25a',x);R(7,6,1,2,'#ffd25a',x)},
  match:x=>{R(5,3,2,8,'#f0d8a8',x);R(4,1,4,3,'#ff5a5a',x)},
  recipe:x=>{R(2,1,8,10,'#fff1d6',x);R(3,3,6,1,'#a07a50',x);R(3,5,5,1,'#a07a50',x);R(3,7,6,1,'#a07a50',x);R(7,9,2,1,'#7ad87a',x)},
  diary1:book('#d8506a'),diary2:book('#4aa08a'),diary3:book('#6a6ad8')
};

let S;
function reset(){S={t:TIME,room:'hall',items:['candy'],safe:false,hatch:false,oven:false,lit:false,box:false,glimpse:false,ghost:false,returned:false,gone:false,over:false,running:false,seen:{},visited:{hall:1},n:{},hs:{},flash:0,tap:null,q:[],cb:null,hints:0,art:'start',diaries:0}}
reset();

/* ---------- 대사 ---------- */
function say(lines,cb){clearInterval(typeT);S.typing=false;if(S.cb){const f=S.cb;S.cb=null;S.q=[];f()}S.q=lines.slice();S.cb=cb||null;next()}
function next(){
  if(S.typing){skipType();return}
  if(!S.q.length){$('more').hidden=true;const cb=S.cb;S.cb=null;if(cb)cb();return}
  const [w,t]=S.q.shift();
  $('who').textContent=w||'나';$('who').className=(w&&/루카|유령|속삭임/.test(w))?'g':'';
  face(w||'');$('face').hidden=false;$('more').hidden=!S.q.length&&!S.cb;typeLine(t);
}
const talking=()=>S.q.length>0||!!S.cb;
const modalOpen=()=>!$('ov').hidden;
$('box').onclick=()=>{if(modalOpen())return;if(S.typing)return skipType();if(talking())next()};
function chapter(txt){const el=$('chap');el.textContent=txt;el.hidden=false;clearTimeout(chapter.t);chapter.t=setTimeout(()=>el.hidden=true,2600)}

/* ---------- 가방 ---------- */
const has=id=>S.items.includes(id);
function give(...ids){ids.forEach(id=>{if(!has(id))S.items.push(id)});inv();sfx('item');toast(ids[ids.length-1])}
function take(...ids){S.items=S.items.filter(i=>!ids.includes(i));inv()}
function inv(){
  const el=$('inv');el.innerHTML='';
  S.items.forEach(id=>{
    const b=document.createElement('button');b.className='slot';b.type='button';
    const ic=document.createElement('canvas');ic.width=ic.height=12;ICON[id](ic.getContext('2d'));
    b.append(ic,ITEMS[id].n);
    b.onclick=()=>{if(!S.running||modalOpen())return;DIARY[id]?readDiary(id):say([[ITEMS[id].n,ITEMS[id].d]])};
    el.append(b);
  });
}
function readDiary(id,cb){
  const [h,...ps]=DIARY[id];
  modal(`<div class="eyebrow">DIARY</div><h2>${h}</h2><div class="diary">${ps.map(p=>`<p>${p}</p>`).join('')}</div><button type="button" class="big" id="dc">덮기</button>`,
    ()=>$('dc').onclick=()=>{close();cb&&cb()});
}

/* ---------- 오버레이 ---------- */
function modal(html,bind){$('card').innerHTML=html;$('card').scrollTop=0;$('ov').hidden=false;bind&&bind()}
function close(){$('ov').hidden=true}

/* ---------- 방 이동 ---------- */
const ROOMNAME={hall:'거실',kitchen:'부엌',attic:'다락방'};
function nav(){$('nav').querySelectorAll('button').forEach(b=>{const r=b.dataset.room;b.setAttribute('aria-current',r===S.room);b.disabled=r==='attic'&&!S.hatch;b.textContent=r==='attic'&&!S.hatch?'다락방 (잠김)':ROOMNAME[r]})}

function hintStage(){
  if(!S.safe)return['safe','거실 왼쪽 책장을 눌러 쪽지를 읽고, 오른쪽 위 달력을 봐. 마녀가 가장 좋아하는 날은 할로윈이야.','정답: 1031 (10월 31일). 거실 오른쪽 회색 금고를 눌러 1·0·3·1로 맞추고 [열기].'];
  if(!S.hatch)return['hatch','금고에서 나온 별 열쇠는 거실 천장에 있는 작은 문에 맞아.','거실 왼쪽 위, 책장 바로 위 천장의 문을 눌러. 열리면 아래 [다락방] 버튼으로 올라가.'];
  if(!S.oven)return['oven','일기 1에 나온 "마녀의 시간"은 시계가 열두 번 울리는 자정이야. 부엌 왼쪽 검은 오븐을 눌러.','정답: 12. 부엌 오븐 다이얼을 1·2로 맞추고 [열기].'];
  if(!S.lit)return['lit','오븐에서 나온 성냥은 다락방에서 써. 다락방은 너무 어둡지?','[다락방] 버튼 → 왼쪽 작은 탁자 위의 초를 누르면 불이 붙어.'];
  if(!S.box)return['box','불이 켜지면 다락방 벽 가운데 그림이 보여. 그림 순서가 장난감 상자 비밀번호야.','정답: 고양이 → 달 → 호박 → 박쥐. 다락방 아래쪽 장난감 상자를 눌러 입력해.'];
  const miss=Object.keys(WHERE).filter(k=>!has(k)&&!S.ghost);
  if(miss.length)return['ing-'+miss.join(),'물약 재료가 아직 없어: '+miss.map(k=>ITEMS[k].n).join(', ')+'. 세 방을 돌아다녀 봐.','찾을 곳: '+miss.map(k=>WHERE[k]).join(' / ')+'. 누르면 바로 가방에 들어와.'];
  if(!S.ghost)return['brew','재료 셋이 다 모였어. 부엌 가운데 벽난로의 가마솥을 눌러 레시피 순서대로 넣어.','정답: 달빛 이슬 → 거미줄 → 박쥐 날개 순서로 누르고 [끓이기].'];
  return['bowl','거실로 돌아가 의자 위 사탕 그릇을 눌러 봐.','사탕 그릇을 누르고 "그릇에 돌려놓는다"를 고르면 문이 열려.'];
}
function hint(){const[k,a,b]=hintStage();S.hs[k]=(S.hs[k]||0)+1;return S.hs[k]>1?b:a}
$('hintBtn').onclick=()=>{
  if(!S.running||S.over||modalOpen())return;
  S.t=Math.max(1,S.t-10);S.hints++;tickView();
  const line=[S.ghost?'루카':'누군가의 속삭임',hint()];
  clearInterval(typeT);S.typing=false;sfx('item');if(talking()){S.q.unshift(line);next()}else say([line]);
};

/* ---------- 시간 ---------- */
function tickView(){const m=String((S.t/60)|0).padStart(2,'0'),s=String(S.t%60).padStart(2,'0');$('timer').textContent=m+':'+s;$('timer').classList.toggle('low',S.t<=60)}
setInterval(()=>{if(!S.running||S.over)return;S.t--;tickView();if(S.t<=0)end('time')},1000);

/* ---------- 시작 / 끝 ---------- */
const ART_TAG='<canvas id="art" width="160" height="110" aria-hidden="true"></canvas>';
const LESSON=`<div class="lesson"><div class="eyebrow">오늘의 교훈</div><strong>가장 달콤한 사탕은<br>함께 나눠 먹는 사탕이에요</strong>
  <p>혼자 다 먹은 루카의 사탕은<br>하나도 달지 않았어요.<br>내 것을 조금 남겨 두면,<br>다른 사람의 할로윈까지 달콤해져요.</p></div>`;
function start(){
  S.art='start';
  modal(`<div class="eyebrow">HALLOWEEN NIGHT</div>${ART_TAG}<h2>마녀의 사탕 그릇</h2>
    <p>사탕 그릇을 몽땅 털어 온 할로윈 밤,<br>정신을 차려 보니 마녀의 집에 갇혀 버렸다!<br>해가 뜨기 전에 여기서 나갈 수 있을까?</p>
    <div class="chips"><span><b>반짝</b> 누르기</span><span><b>8분</b> 안에 탈출</span><span><b>힌트</b> 두 번 = 정답</span></div>
    <button type="button" class="big" id="go">마녀의 집 들어가기</button>`,()=>{
    $('go').onclick=()=>{close();sfx('door');S.running=true;tickView();chapter('CHAPTER 1 · 거실');
      say([['마녀의 목소리','욕심쟁이로구나. 해가 뜰 때까지 이 집에서 못 나간다.'],
        ['마녀의 목소리','백 년 전에도 너 같은 아이가 있었지. 그 아이는… 아직 여기 있단다.'],
        [,'남은 시간은 8분. 반짝이는 곳을 눌러 집 안을 살펴보자.']])};
  });
}
function end(kind){
  S.over=true;S.running=false;S.art=kind;skipType();sfx(kind==='good'?'door':'sad');
  const used=TIME-S.t,mm=(used/60)|0,ss=String(used%60).padStart(2,'0');
  const T={
    good:['HAPPY ENDING','그리고 1년 뒤',`<p>문이 열리자 새벽 공기가 들어왔다.<br>루카는 백 년 만에<br>할머니 곁으로 돌아갔다.</p>
      <p>1년 뒤 할로윈,<br>나는 다시 언덕 위 그 집 앞에 섰다.<br>그릇은 사탕으로 가득하고,<br>팻말에는 처음 보는 글씨가<br>한 줄 늘어 있었다.</p>
      <p><b>"1인당 1개만!<br>남은 건 친구 몫 — L"</b></p>
      <p>사탕을 딱 하나만 집고 돌아서는데,<br>다락방 창가에서<br>누군가 손을 흔들었다.<br>…설마?</p>`,'처음부터 다시 하기'],
    keep:['BAD ENDING','두 번째 유령',`<p>사탕은 지켰지만<br>문은 영영 열리지 않았다.<br>다락방 창가에<br>작은 그림자가 하나 늘었다.</p>
      <p class="mute">루카와 같은 선택을 했어요.<br>다른 선택을 하면<br>해피엔딩을 볼 수 있어요.</p>`,'다른 선택 해 보기'],
    time:['TIME OVER','아쉽게도 해가 떴어요',`<p>이 집에는 <b>해피엔딩</b>과 <b>배드엔딩</b>,<br>두 개의 결말이 숨어 있어요.</p>
      <p>루카는 누구인지,<br>문 너머에 무엇이 기다리는지<br>궁금하다면 꼭 탈출해 보세요!</p>
      <p class="mute">막히면 힌트를 두 번 눌러 보세요.<br>당신이라면 할 수 있어요!</p>`,'다시 도전하기']
  }[kind];
  const stats=kind==='good'?`<div class="chips"><span>탈출 <b>${mm}분 ${ss}초</b></span><span>힌트 <b>${S.hints}번</b></span><span>일기 <b>${S.diaries}/3</b></span></div>`:'';
  modal(`<div class="eyebrow">${T[0]}</div>${ART_TAG}<h2>${T[1]}</h2>${T[2]}${kind==='time'?'':LESSON}${stats}
    <button type="button" class="big" id="again">${T[3]}</button>`,()=>{
    $('again').onclick=()=>{reset();inv();nav();tickView();$('who').textContent='';$('line').textContent='';start()}});
}

/* ---------- 크기 맞춤 ---------- */
function fit(){const r=$('stage').getBoundingClientRect(),s=Math.min((r.width-6)/160,(r.height-6)/200);cv.style.width=160*s+'px';cv.style.height=200*s+'px'}
new ResizeObserver(fit).observe($('stage'));

inv();nav();tickView();start();requestAnimationFrame(frame);
</script>

</body>
</html>
